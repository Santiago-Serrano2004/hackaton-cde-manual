<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
<title id="t">Cada dato dice de dónde viene: del dato al impacto comprobable</title>
<desc id="d">Seis pasos en dos columnas. Conocer: cuatro fuentes llegan al aviso de NIT y duplicados, que deja una ficha única con sello de procedencia. Probar: la ficha guía citas, planes y eventos, que producen impacto declarado y verificado, que alimenta un reporte comprobable. Borde discontinuo: mejora propuesta.</desc>
<defs><marker id="h" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1B2340"/></marker></defs>
<rect width="1920" height="1080" fill="#F7F4EF"/>
<text x="60" y="70" font-family="Inter, Carlito, Arial, sans-serif" font-size="52" font-weight="700" fill="#16265C">1 · Conocer</text>
<text x="1100" y="70" font-family="Inter, Carlito, Arial, sans-serif" font-size="52" font-weight="700" fill="#16265C">2 · Acompañar y probar</text>
<rect x="60" y="110" width="800" height="200" rx="14" fill="#FFFFFF" stroke="#16265C" stroke-width="7"/><text x="460.0" y="196.0" text-anchor="middle" font-family="Inter, Carlito, Arial, sans-serif" font-size="52" font-weight="700" fill="#16265C">Fuentes del dato</text><text x="460.0" y="262.0" text-anchor="middle" font-family="Inter, Carlito, Arial, sans-serif" font-size="48" fill="#16265C">equipo, archivo, registro, usuario</text>
<rect x="60" y="430" width="800" height="200" rx="14" fill="#FFF4D6" stroke="#B34700" stroke-dasharray="22 12" stroke-width="7"/><text x="460.0" y="516.0" text-anchor="middle" font-family="Inter, Carlito, Arial, sans-serif" font-size="52" font-weight="700" fill="#6B4200">Aviso de NIT y duplicados</text><text x="460.0" y="582.0" text-anchor="middle" font-family="Inter, Carlito, Arial, sans-serif" font-size="48" fill="#6B4200">explica por qué son iguales</text>
<rect x="60" y="750" width="800" height="200" rx="14" fill="#FFF4D6" stroke="#B34700" stroke-dasharray="22 12" stroke-width="7"/><text x="460.0" y="836.0" text-anchor="middle" font-family="Inter, Carlito, Arial, sans-serif" font-size="52" font-weight="700" fill="#6B4200">Ficha única con sello</text><text x="460.0" y="902.0" text-anchor="middle" font-family="Inter, Carlito, Arial, sans-serif" font-size="48" fill="#6B4200">verificado, declarado o revisar</text>
<rect x="1100" y="110" width="760" height="200" rx="14" fill="#FFFFFF" stroke="#16265C" stroke-width="7"/><text x="1480.0" y="196.0" text-anchor="middle" font-family="Inter, Carlito, Arial, sans-serif" font-size="52" font-weight="700" fill="#16265C">Citas, planes y eventos</text><text x="1480.0" y="262.0" text-anchor="middle" font-family="Inter, Carlito, Arial, sans-serif" font-size="48" fill="#16265C">recordatorios automáticos</text>
<rect x="1100" y="430" width="760" height="200" rx="14" fill="#FFF4D6" stroke="#B34700" stroke-dasharray="22 12" stroke-width="7"/><text x="1480.0" y="516.0" text-anchor="middle" font-family="Inter, Carlito, Arial, sans-serif" font-size="52" font-weight="700" fill="#6B4200">Impacto</text><text x="1480.0" y="582.0" text-anchor="middle" font-family="Inter, Carlito, Arial, sans-serif" font-size="48" fill="#6B4200">declarado y verificado</text>
<rect x="1100" y="750" width="760" height="200" rx="14" fill="#FFFFFF" stroke="#16265C" stroke-width="7"/><text x="1480.0" y="836.0" text-anchor="middle" font-family="Inter, Carlito, Arial, sans-serif" font-size="52" font-weight="700" fill="#16265C">Reporte comprobable</text><text x="1480.0" y="902.0" text-anchor="middle" font-family="Inter, Carlito, Arial, sans-serif" font-size="48" fill="#16265C">con fuente y definiciones</text>
<line x1="460.0" y1="310" x2="460.0" y2="430" stroke="#1B2340" stroke-width="7" marker-end="url(#h)"/><text x="484.0" y="382" font-family="Inter, Carlito, Arial, sans-serif" font-size="48" fill="#1B2340">llegan a</text>
<line x1="460.0" y1="630" x2="460.0" y2="750" stroke="#1B2340" stroke-width="7" marker-end="url(#h)"/><text x="484.0" y="702" font-family="Inter, Carlito, Arial, sans-serif" font-size="48" fill="#1B2340">dejan</text>
<line x1="1480.0" y1="310" x2="1480.0" y2="430" stroke="#1B2340" stroke-width="7" marker-end="url(#h)"/><text x="1504.0" y="382" font-family="Inter, Carlito, Arial, sans-serif" font-size="48" fill="#1B2340">producen</text>
